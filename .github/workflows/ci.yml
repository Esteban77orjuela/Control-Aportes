name: React Native Expo CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-lint:
    name: 🧪 Control de Calidad (QA)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: ⚙️ Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Instalar dependencias
        run: npm ci || npm install

      - name: 🔍 Auditoría de Seguridad (npm audit)
        run: npm audit --audit-level=high --omit=dev || echo "Vulnerabilidades encontradas. Revisar."

      - name: 🧹 Ejecutar Linter (ESLint)
        run: npm run lint

      - name: 🧪 Ejecutar Pruebas Unitarias (Jest)
        run: npm run test
