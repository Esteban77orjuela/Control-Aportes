name: Deploy APK con EAS Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Perfil de build (preview/production)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build con EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive
