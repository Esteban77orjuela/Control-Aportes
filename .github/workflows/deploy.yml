name: Deploy APK con EAS Build

on:
  workflow_dispatch:
    inputs:
      action:
        description: Acción a ejecutar
        required: true
        default: update
        type: choice
        options:
          - update
          - build
      profile:
        description: Canal (preview/production)
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Configurar EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Publicar actualización OTA (EAS Update)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'update' || github.event_name == 'push'
        run: eas update --channel ${{ inputs.profile || 'preview' }} --non-interactive --message "Update ${{ github.sha }}"

      - name: Compilar APK (EAS Build)
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'build'
        run: eas build --platform android --profile ${{ inputs.profile || 'preview' }} --non-interactive
